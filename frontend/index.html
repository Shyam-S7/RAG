<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant | RAG Pro</title>
    <meta name="description" content="A professional ChatGPT-style RAG interface for intelligent document retrieval.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Drag & Drop Overlay -->
        <div class="drag-overlay" id="drag-overlay">
            <div class="drag-content">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                <p>Drop your documents here</p>
            </div>
        </div>
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" id="new-chat-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    New Chat
                </button>
            </div>
            <div class="chat-history-label">Recent Chats</div>
            <div class="chat-history" id="chat-history">
                <!-- History items -->
            </div>
            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="avatar">S</div>
                    <div class="user-info">
                        <span class="user-name">Shyam S7</span>
                        <span class="user-status">Pro Account</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <div class="left-header">
                    <button class="mobile-menu-btn" id="mobile-menu-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                    </button>
                    <div class="model-selector">
                        <span>RAG Assistant</span>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
                    </div>
                </div>
                <div class="header-actions">
                    <div class="status-badge">
                        <span class="status-dot"></span>
                        <span class="status-text">Connected</span>
                    </div>
                </div>
            </header>

            <div class="chat-container" id="chat-container">
                <div class="welcome-screen" id="welcome-screen">
                    <div class="logo-icon">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    </div>
                    <h2>How can I help you today?</h2>
                    <div class="suggestions">
                        <div class="suggestion-card">Summarize my documents</div>
                        <div class="suggestion-card">Explain the RAG methodology</div>
                        <div class="suggestion-card">Compare two PDF files</div>
                    </div>
                </div>
                <!-- Messages will be injected here -->
            </div>

            <footer class="input-area">
                <div class="upload-status hidden" id="upload-status">
                    <div class="file-info">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>
                        <span id="file-name-display">filename.pdf</span>
                        <button id="remove-file-btn" title="Remove file">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                    </div>
                    <button id="process-btn" class="process-btn">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        Process
                    </button>
                </div>
                <div class="input-wrapper">
                    <input type="file" id="file-upload" accept=".pdf,.txt,.md" hidden>
                    <button id="upload-btn" title="Upload document (PDF, TXT, MD)">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.51a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                    </button>
                    <textarea id="user-input" placeholder="Ask anything about your documents..." rows="1"></textarea>
                    <button id="send-btn" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
                <p class="disclaimer">Professional AI Assistant. Information may be retrieved from your private knowledge base.</p>
            </footer>
        </main>
    </div>

    <!-- Templates -->
    <template id="message-template">
        <div class="message">
            <div class="message-content">
                <div class="message-header">
                    <div class="msg-avatar"></div>
                    <span class="msg-author"></span>
                </div>
                <div class="message-text"></div>
                <div class="sources-container hidden">
                    <div class="sources-divider"></div>
                    <button class="sources-toggle">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m18 15-6-6-6 6"/></svg>
                        Reference Documents (0)
                    </button>
                    <div class="sources-list hidden"></div>
                </div>
            </div>
        </div>
    </template>

    <script src="script.js"></script>
</body>
</html>
